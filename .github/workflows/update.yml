name: Update jobs and deploy site

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests (only when code is pushed)
        if: github.event_name == 'push'
        run: python -m unittest discover -s tests -t . -v

      - name: Fetch jobs and build site/jobs.json
        env:
          SEARCH_POSTCODE: ${{ secrets.SEARCH_POSTCODE }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          # "Run workflow" by hand fetches Reed (and Adzuna) even if it isn't their turn
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # Adzuna is a paid API and stays off unless you add these three:
          ENABLE_ADZUNA: ${{ secrets.ENABLE_ADZUNA }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python build.py

      - name: Save job history (only commits when something changed)
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update job history"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
