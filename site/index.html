<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobwatch</title>
<style>
:root{box-sizing:border-box;--bg:#f3f4fb;--tx:#161a2e;--mut:#5b6280;--card:rgba(255,255,255,.75);--bd:rgba(30,40,90,.12);--b1:#b9cdff;--b2:#ffc6e0;--in:rgba(255,255,255,.85);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090b15;--tx:#eceefb;--mut:#9aa1c2;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--b1:#27418f;--b2:#7a2b5c;--in:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#090b15;--tx:#eceefb;--mut:#9aa1c2;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--b1:#27418f;--b2:#7a2b5c;--in:rgba(255,255,255,.07);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5;z-index:-1;animation:d 22s ease-in-out infinite alternate}
body::before{background:var(--b1);top:-25vmax;left:-15vmax}body::after{background:var(--b2);bottom:-30vmax;right:-20vmax;animation-delay:-9s}
@keyframes d{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.wrap{max-width:1000px;margin:0 auto;padding:26px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;background:linear-gradient(90deg,#6aa6ff,#ff7ab6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:4px 0 0;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;margin-right:6px}.dot.old{background:#fb923c}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row+.row{margin-top:12px}
input[type=search],input[type=text],select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font:inherit;min-width:0}
input[type=search]{flex:1 1 220px}input[type=text]{width:120px}input[type=range]{accent-color:#6aa6ff;width:130px}
label{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:8px}
.chip,.btn{border:1px solid var(--bd);background:var(--in);color:var(--tx);padding:6px 13px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px;transition:.2s}
.chip[aria-pressed=true]{background:var(--c,#6aa6ff);border-color:var(--c,#6aa6ff);color:#fff}
.chip:hover,.btn:hover{transform:translateY(-1px)}
#ftog{display:none}
#fbody{margin-top:12px}
.count{color:var(--mut);font-size:13px;margin:18px 2px 10px}
.grid{display:grid;gap:12px}
.job{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--c);border-radius:16px;padding:15px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr auto;gap:6px 14px;animation:i .4s both}
.job.dim{opacity:.55}
@keyframes i{from{opacity:0;transform:translateY(8px)}}
.emp{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.job h3{margin:2px 0;font-size:16px}.meta{color:var(--mut);font-size:13px}
.sal{font-weight:650;text-align:right;white-space:nowrap}.sal small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);background:var(--in)}
.tag.new{background:#34d399;color:#04241a;border-color:#34d399;font-weight:700}.tag.hot{background:#fb923c;color:#2a1000;border-color:#fb923c;font-weight:700}
.tag.warn{background:#fde68a;color:#3b2a00;border-color:#fde68a}
.links{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.links a{color:#fff;background:var(--c);padding:4px 12px;border-radius:99px;text-decoration:none;font-size:13px;font-weight:600}
.btn.sm{padding:3px 10px;font-size:12px}
.desc{grid-column:1/-1;margin:2px 0 0;color:var(--mut);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.desc.open{display:block}
.dual{position:relative;width:200px;height:22px;display:inline-block}.dual input{position:absolute;left:0;top:0;width:100%;height:22px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}.dual input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--bd)}.dual input::-moz-range-track{height:4px;border-radius:2px;background:var(--bd)}.dual input:last-child::-webkit-slider-runnable-track{background:transparent}.dual input:last-child::-moz-range-track{background:transparent}.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#6aa6ff;border:2px solid #fff;cursor:pointer}.dual input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#6aa6ff;border:2px solid #fff;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:40px}
@media(max-width:560px){.job{grid-template-columns:1fr}.sal{text-align:left}.wrap{padding:20px 12px 48px}input,select{font-size:16px}.chip,.btn{min-height:40px}label{flex:1 1 100%;justify-content:space-between}input[type=text]{width:140px}input[type=range]{width:100%}.dual{flex:1;max-width:260px}#ftog{display:inline-block;margin-top:12px}#fbody{display:none;margin-top:4px}#fbody.open{display:block}}
</style></head>
<body><div class="wrap">
<header><div><h1>Jobwatch</h1><p class="sub" id="upd">Loading…</p></div><button class="chip" id="theme">◐ Theme</button></header>
<div class="panel">
<div class="row"><input type="search" id="q" placeholder="Search title, employer, place…" aria-label="Search"><select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="sal">Highest salary</option><option value="dist">Nearest first</option><option value="close">Closing soonest</option></select></div>
<button class="chip" id="ftog" aria-pressed="false">⚙ Filters</button>
<div id="fbody">
<div class="row"><label>My postcode <input type="text" id="pc" placeholder="e.g. LS1 4AP" autocomplete="postal-code"></label><button class="btn" id="setpc">Set</button><span class="meta" id="pcmsg"></span></div>
<div class="row"><label>Within <input type="range" id="rad" min="5" max="300" step="5" value="150"> <b id="radv">150</b> mi</label>
<label>Employer <select id="emp"></select></label><label>Salary <span class="dual"><input type="range" id="min" min="0" max="100000" step="1000" value="0" aria-label="Minimum salary"><input type="range" id="max" min="0" max="100000" step="1000" value="100000" aria-label="Maximum salary"></span> <b id="minv">Any</b></label></div>
<div class="row" id="chips"></div>
<div class="row" id="toggles"></div>
</div></div>
<div class="count" id="count"></div><div class="grid" id="list"></div>
<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="more" hidden>Show more</button></div>
</div>
<script>
const CATS={nhs:["NHS clinical","#4da3ff"],priv:["Private &amp; independent","#ff6fa8"],res:["Research","#8b7bff"],adj:["Medical-adjacent","#2dd4a7"],soc:["Social care &amp; support","#f59e0b"],gen:["Other work","#94a3b8"],aes:["Aesthetics","#c084fc"]};
const STAT=["Saved","Applied","Interview","Offer","Rejected"];
const SRC={nhs:"NHS Jobs",reed:"Reed",jobsac:"jobs.ac.uk",employer:"Employer site",adzuna:"Adzuna"};
const TOG=[["inside","Pay fully inside salary range",1],["ft","Full time only",1],["nmw","At least minimum wage",1],["clean","Hide non-doctor &amp; other-specialty",1],["closed","Show closed &amp; stale",0],["mine","My applications only",0],["hid","Show hidden",0]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D={jobs:[],settings:{nlw_full_time_annual:24785}},ST={},HOME=null,shown=100;
const on={};TOG.forEach(t=>on[t[0]]=!!t[2]);
try{ST=JSON.parse(localStorage.getItem("jw2")||"{}");HOME=JSON.parse(localStorage.getItem("jwhome")||"null")}catch(e){}
const keep=()=>{try{localStorage.setItem("jw2",JSON.stringify(ST))}catch(e){}};
const mi=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 3959*2*Math.asin(Math.sqrt(x))};
const k=n=>"£"+(n>=1000?Math.round(n/100)/10+"k":n);
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);return m<2?"just now":m<90?m+" min ago":m<2880?Math.round(m/60)+" hours ago":Math.round(m/1440)+" days ago"};
const dleft=s=>s?Math.ceil((new Date(s+"T23:59:59")-Date.now())/864e5):null;
const sel=new Set(Object.keys(CATS));
$("chips").innerHTML=Object.entries(CATS).map(([c,[n,col]])=>`<button class="chip" data-k="${c}" style="--c:${col}" aria-pressed="true">${n}</button>`).join("");
$("toggles").innerHTML=TOG.map(t=>`<button class="chip" data-t="${t[0]}" aria-pressed="${!!t[2]}">${t[1]}</button>`).join("");
if(HOME){$("pc").value=HOME.pc;$("pcmsg").textContent="✓ location set"}
// Slider ends (0 and 100k) mean no limit. "inside": whole pay range within the slider; off: any overlap.
function payOk(j,mn,mx){
 if(mn===0&&mx>=1e5)return true;
 if(!j.salary_stated)return false;
 const lo=j.salary_min??j.salary_max??0,hi=j.salary_max??j.salary_min??0;
 return on.inside?(mn===0||lo>=mn)&&(mx>=1e5||hi<=mx):hi>=mn&&lo<=mx}
function filtered(){
 const q=$("q").value.toLowerCase(),R=+$("rad").value,mn=Math.min(+$("min").value,+$("max").value),mx=Math.max(+$("min").value,+$("max").value),E=$("emp").value,fl=D.settings.nlw_full_time_annual;
 let L=D.jobs.map(j=>({...j,dist:HOME&&j.lat!=null?mi(HOME.lat,HOME.lng,j.lat,j.lng):null})).filter(j=>{
  const s=ST[j.id]||{};
  return sel.has(j.category)&&(E===""||j.employer===E)&&(!HOME||j.dist==null||j.dist<=R)&&
   payOk(j,mn,mx)&&(!on.ft||j.full_time!==false)&&(!on.nmw||!j.salary_stated||j.salary_estimated||j.salary_min>=fl)&&
   (!on.clean||!j.flags.some(f=>f=="non-doctor-role"||f=="other-specialty"))&&(on.closed||j.status=="open")&&
   (!on.mine||s.st)&&(on.hid||!s.hide)&&`${j.title} ${j.employer} ${j.location}`.toLowerCase().includes(q)});
 const so=$("sort").value,t=x=>Date.parse(x.first_seen);
 L.sort((a,b)=>so=="sal"?(b.salary_max||0)-(a.salary_max||0):so=="dist"?(a.dist??9e9)-(b.dist??9e9):so=="close"?(dleft(a.closing)??9e9)-(dleft(b.closing)??9e9):t(b)-t(a));
 return L}
function card(j){
 const s=ST[j.id]||{},c=CATS[j.category]?.[1]||"#888",dl=dleft(j.closing),isNew=Date.now()-Date.parse(j.first_seen)<864e5;
 const pay=j.salary_stated?`${k(j.salary_min)}${j.salary_max!=j.salary_min?" – "+k(j.salary_max):""}<small>${j.salary_estimated?"estimated by site":j.salary_converted?"converted to full-time yearly":"per year"}</small>`:`<span class="meta">Pay not stated</span>`;
 const hrs=j.hours_per_week?`${j.hours_per_week} hrs/wk`:j.full_time===true?"Full time":j.full_time===false?"Part time":"Hours not stated";
 return `<article class="job${j.status!="open"||s.hide?" dim":""}" style="--c:${c}">
 <div><div class="emp">${esc(j.employer)}</div><h3>${esc(j.title)}</h3><div class="meta">${esc(j.location||"Location not stated")}${j.dist!=null?" · "+Math.round(j.dist)+" mi":""} · ${hrs} · ${esc(j.contract_type=="unknown"?"Contract not stated":j.contract_type)}</div></div>
 <div class="sal">${pay}</div>${j.snippet?`<p class="desc" title="Click to read more">${esc(j.snippet)}</p>`:""}
 <div class="tags"><span class="tag">${CATS[j.category]?.[0]||""}</span>${isNew?'<span class="tag new">New</span>':""}${j.status=="stale"?'<span class="tag warn">May have gone: not seen on source</span>':""}${j.status=="closed"?'<span class="tag warn">Closed</span>':""}
 ${j.closing?(dl!=null&&dl<=3&&dl>=0?`<span class="tag hot">Closes in ${dl}d</span>`:`<span class="meta">closes ${esc(j.closing)}</span>`):'<span class="meta">no closing date</span>'}
 ${j.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${j.flags.includes("needs-nhs-experience")?'<span class="tag warn">NHS experience asked for</span>':""}</div>
 <div class="links">${j.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${SRC[l.source]||esc(l.source)}</a>`).join("")}
 <select data-a="st" data-i="${j.id}" aria-label="Application status"><option value="">Track…</option>${STAT.map(x=>`<option${s.st==x?" selected":""}>${x}</option>`).join("")}</select>
 ${j.closing&&dl>=0?`<button class="btn sm" data-a="ics" data-i="${j.id}">📅 Remind me</button>`:""}
 <button class="btn sm" data-a="hide" data-i="${j.id}">${s.hide?"Unhide":"Hide"}</button></div></article>`}
function render(){
 $("radv").textContent=$("rad").value;{const lo=Math.min(+$("min").value,+$("max").value),hi=Math.max(+$("min").value,+$("max").value);$("minv").textContent=lo==0&&hi>=1e5?"Any":lo==0?"up to £"+hi/1000+"k":hi>=1e5?"£"+lo/1000+"k+":"£"+lo/1000+"k – £"+hi/1000+"k"}
 const L=filtered();
 $("count").textContent=`${L.length} role${L.length==1?"":"s"} match`;
 $("list").innerHTML=L.length?L.slice(0,shown).map(card).join(""):'<div class="empty">Nothing matches. Try widening the radius or turning a filter off.</div>';
 $("more").hidden=L.length<=shown}
function ics(j){
 const d=j.closing.replace(/-/g,""),n=new Date(j.closing+"T00:00:00Z");n.setUTCDate(n.getUTCDate()+1);
 const e=n.toISOString().slice(0,10).replace(/-/g,""),t=s=>String(s).replace(/([,;\\])/g,"\\$1");
 const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Jobwatch//EN","BEGIN:VEVENT",`UID:${j.id}@jobwatch`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:${t("Closes: "+j.title+" ("+j.employer+")")}`,`URL:${j.links[0].url}`,"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Job closes tomorrow","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([body],{type:"text/calendar"}));a.download="job-closing.ics";a.click()}
document.addEventListener("input",e=>{if(e.target.dataset.a)return;shown=100;render()});
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const c=b.dataset.k;sel.has(c)?sel.delete(c):sel.add(c);b.setAttribute("aria-pressed",sel.has(c));shown=100;render()};
$("toggles").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const t=b.dataset.t;on[t]=!on[t];b.setAttribute("aria-pressed",on[t]);shown=100;render()};
$("list").onclick=e=>{const d=e.target.closest(".desc");if(d){d.classList.toggle("open");return}const b=e.target.closest("[data-a]");if(!b||b.tagName=="SELECT")return;const i=b.dataset.i,j=D.jobs.find(x=>x.id==i);
 if(b.dataset.a=="ics")ics(j);if(b.dataset.a=="hide"){ST[i]={...ST[i],hide:!(ST[i]||{}).hide};keep();render()}};
$("list").onchange=e=>{const b=e.target;if(b.dataset.a!="st")return;ST[b.dataset.i]={...ST[b.dataset.i],st:b.value,at:new Date().toISOString().slice(0,10)};keep()};
$("more").onclick=()=>{shown+=100;render()};
$("ftog").onclick=()=>{const o=$("fbody").classList.toggle("open");$("ftog").setAttribute("aria-pressed",o)};
$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).colorScheme=="dark"?"light":"dark"};
$("setpc").onclick=async()=>{
 const pc=$("pc").value.trim();if(!pc){HOME=null;try{localStorage.removeItem("jwhome")}catch(e){}$("pcmsg").textContent="";return render()}
 $("pcmsg").textContent="Looking up…";
 try{const r=await fetch("https://api.postcodes.io/postcodes/"+encodeURIComponent(pc)),d=await r.json();
  if(!d.result)throw 0;HOME={pc:pc.toUpperCase(),lat:d.result.latitude,lng:d.result.longitude};
  try{localStorage.setItem("jwhome",JSON.stringify(HOME))}catch(e){}$("pcmsg").textContent="✓ location set"}
 catch(e){$("pcmsg").textContent="Couldn’t find that postcode"}
 render()};
fetch("jobs.json?"+Date.now()).then(r=>r.json()).then(d=>{
 D=d;const old=Date.now()-Date.parse(d.generated)>36e5*3;
 $("upd").innerHTML=`<span class="dot${old?" old":""}"></span>Updated ${ago(d.generated)}${d.sources.not_updated.length?` · not updated this time: ${d.sources.not_updated.map(s=>SRC[s]||s).join(", ")}`:""}`;
 const E=[...new Set(d.jobs.map(j=>j.employer))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
 $("emp").innerHTML='<option value="">All employers</option>'+E.map(e=>`<option>${esc(e)}</option>`).join("");render()
}).catch(()=>{$("upd").textContent="Couldn’t load jobs.json yet. Run the workflow once, then refresh.";$("count").textContent=""});
</script></body></html>
