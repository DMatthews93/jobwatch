<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jobwatch</title>
  <!-- Bump ?v= on both files whenever style.css or app.js changes, so browsers skip old cached copies. -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Jobwatch</h1><p class="sub" id="upd">Loading…</p></div>
    <button class="chip" id="theme">◐ Theme</button>
  </header>

  <div class="panel">
    <div class="row">
      <input type="search" id="q" placeholder="Search title, employer, place…" aria-label="Search">
      <select id="sort" aria-label="Sort">
        <option value="new">Newest first</option>
        <option value="sal">Highest salary</option>
        <option value="dist">Nearest first</option>
        <option value="close">Closing soonest</option>
      </select>
    </div>
    <button class="chip" id="ftog" aria-pressed="false">⚙ Filters</button>
    <div id="fbody">
      <div class="row">
        <label>My postcode <input type="text" id="pc" placeholder="e.g. LS1 4AP" autocomplete="postal-code"></label>
        <button class="btn" id="setpc">Set</button>
        <span class="meta" id="pcmsg"></span>
      </div>
      <div class="row">
        <label>Within <input type="range" id="rad" min="5" max="300" step="5" value="150"> <b id="radv">150</b> mi</label>
        <label>Employer <select id="emp"></select></label>
        <label>Salary <span class="dual"><input type="range" id="min" min="0" max="100000" step="1000" value="0" aria-label="Minimum salary"><input type="range" id="max" min="0" max="100000" step="1000" value="100000" aria-label="Maximum salary"></span> <b id="minv">Any</b></label>
      </div>
      <div class="row" id="chips"></div>
      <div class="row" id="toggles"></div>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="grid" id="list"></div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="more" hidden>Show more</button></div>
</div>
<script src="app.js?v=4"></script>
</body>
</html>
